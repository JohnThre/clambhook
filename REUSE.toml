# SPDX-License-Identifier: GPL-3.0-only

version = 1
SPDX-PackageName = "ClambHook"
SPDX-PackageSupplier = "Pengfan Chang <support@swiphtgroup.com>"
SPDX-PackageDownloadLocation = "https://github.com/JohnThre/clambhook"

# First-party files whose formats do not safely carry comments.
[[annotations]]
path = [
  ".pi-lens.json",
  "NOTICE",
  "debian/changelog",
  "debian/source/format",
  "flake.lock",
  "keys/clambhook-release-key.asc",
  "packaging/icons/**/*.png",
  "packaging/sbom.cdx.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pengfan Chang <support@swiphtgroup.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# MaxMind-DB test fixtures are vendored unchanged under Apache-2.0.
[[annotations]]
path = [
  "third_party/libmaxminddb/testdata/GeoIP2-City-Test.mmdb",
  "third_party/libmaxminddb/testdata/GeoIP2-Country-Test.mmdb",
]
precedence = "override"
SPDX-FileCopyrightText = "MaxMind, Inc."
SPDX-License-Identifier = "Apache-2.0"
