name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  policy:
    name: Source, license, and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install policy tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg shellcheck
      - name: Validate source, publication, license, and cutover policy
        run: |
          scripts/check-github-actions.sh
          scripts/check-license-policy.sh
          scripts/check-cutover.sh
      - name: Lint shell automation
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: Install checksum-pinned actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax
        run: exec "${RUNNER_TEMP}/actionlint"

  native:
    name: C17 strict, sanitizer, and protocol suite
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install C17 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config \
            libuv1-dev libsodium-dev libllhttp-dev libssl-dev libcurl4-openssl-dev \
            iproute2 openvpn socat wireguard-tools
      - name: Run strict ASan and UBSan suite
        run: make test-native
      - name: Run real loopback WireGuard and OpenVPN peers
        run: >-
          CLAMBHOOK_REQUIRE_REAL_PEERS=1
          scripts/test-real-protocol-peers.sh
          build-native-sanitize/clambhook-native-tests

  javafx:
    name: JavaFX runtime client, state, and accessibility tests
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ui/javafx/pom.xml
      - name: Install virtual display for JavaFX semantics tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Verify JavaFX UI and coverage
        run: xvfb-run -a make test-javafx
      - name: Upload JavaFX reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javafx-reports
          path: |
            ui/javafx/target/surefire-reports/
            ui/javafx/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: GNU/Linux ${{ matrix.distro }} ${{ matrix.arch }}
    needs: [native, javafx]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Trisquel 12
            target: trisquel
            arch: x86_64
            runner: ubuntu-24.04
          - distro: Rocky Linux 9
            target: rocky
            arch: x86_64
            runner: ubuntu-24.04
          - distro: AlmaLinux 9
            target: alma
            arch: x86_64
            runner: ubuntu-24.04
          - distro: Trisquel 12
            target: trisquel
            arch: aarch64
            runner: ubuntu-24.04-arm
          - distro: Rocky Linux 9
            target: rocky
            arch: aarch64
            runner: ubuntu-24.04-arm
          - distro: AlmaLinux 9
            target: alma
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trisquel bootstrap tools
        if: matrix.target == 'trisquel'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl debootstrap gnupg
      - name: Validate native image, installation, and package recipe
        run: scripts/validate-linux-distros.sh "${{ matrix.target }}"

  apple:
    name: C17 runtime and SwiftUI macOS client
    needs: policy
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native and Apple build dependencies
        run: |
          brew install cmake ninja pkg-config libuv libsodium llhttp openssl@3 curl xcodegen
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Test C17 runtime
        run: make test-native
      - name: Build and test SwiftUI client
        run: |
          make build-apple
          make test-apple
          make macos-release-contract-check

  android:
    name: Android Kotlin platform and Gluon ARM64 application
    needs: [native, javafx]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ui/javafx/pom.xml
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Restore Android native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/android/.native-deps
          key: >-
            android-native-${{ runner.os }}-${{ runner.arch }}-ndk-${{
            env.ANDROID_NDK_VERSION }}-${{ hashFiles(
            'scripts/build-android-openssl.sh',
            'scripts/build-android-curl.sh') }}
      - name: Install Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
      - name: Test and assemble the Kotlin platform AAR
        run: make test-android
      - name: Provision checksum-pinned GraalVM 17
        run: |
          graal_home="$(bash scripts/provision-graalvm17.sh "$RUNNER_TEMP/graalvm17" | tail -1)"
          echo "$graal_home/bin" >> "$GITHUB_PATH"
          echo "GRAALVM_HOME=$graal_home" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$graal_home" >> "$GITHUB_ENV"
      - name: Build Gluon Android ARM64 application
        run: make build-android
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: ui/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  android-device:
    name: Android API ${{ matrix.api }} ARM64 managed-device journeys
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            task: pixel2Api31DebugAndroidTest
          - api: 33
            task: pixel6Api33DebugAndroidTest
          - api: 36
            task: pixel6Api36DebugAndroidTest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Restore verified Android native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/android/.native-deps
          key: >-
            android-native-${{ runner.os }}-${{ runner.arch }}-ndk-${{
            env.ANDROID_NDK_VERSION }}-${{ hashFiles(
            'scripts/build-android-openssl.sh',
            'scripts/build-android-curl.sh') }}
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install API ${{ matrix.api }} ARM64 ATD image and native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}" 'system-images;android-${{ matrix.api }};aosp_atd;arm64-v8a'
      - name: Run VPN lifecycle and runtime journeys
        working-directory: ui/android
        run: >-
          ./gradlew --no-daemon
          :platform:${{ matrix.task }}
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload managed-device reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ matrix.api }}-reports
          path: ui/android/app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
          retention-days: 14
