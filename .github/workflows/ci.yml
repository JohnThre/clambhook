name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  policy:
    name: Source, license, and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install policy tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg ripgrep shellcheck
      - name: Validate source, publication, license, and cutover policy
        run: |
          scripts/check-github-actions.sh
          scripts/check-license-policy.sh
          scripts/check-cutover.sh
      - name: Lint shell automation
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: Install checksum-pinned actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax
        run: exec "${RUNNER_TEMP}/actionlint"

  native:
    name: C17 strict, sanitizer, and protocol suite
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install C17 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config \
            libuv1-dev libsodium-dev libssl-dev libcurl4-openssl-dev \
            iproute2 openvpn socat wireguard-tools
      - name: Set up Go for pinned official Outline peer
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.24.8"
          cache: false
      - name: Run strict ASan and UBSan suite
        run: make test-native
      - name: Run real loopback WireGuard and OpenVPN peers
        run: >-
          CLAMBHOOK_REQUIRE_REAL_PEERS=1
          scripts/test-real-protocol-peers.sh
          build-native-sanitize/clambhook-native-tests
      - name: Run pinned official Outline TCP, UDP, and prefix peer
        run: scripts/test-outline-interop.sh build-native-sanitize/clambhook-native-tests

  linux:
    name: GNU/Linux ${{ matrix.distro }} ${{ matrix.arch }}
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04
            target: ubuntu
            arch: x86_64
            runner: ubuntu-24.04
          - distro: Fedora Linux 44
            target: fedora
            arch: x86_64
            runner: ubuntu-24.04
          - distro: Ubuntu 24.04
            target: ubuntu
            arch: aarch64
            runner: ubuntu-24.04-arm
          - distro: Fedora Linux 44
            target: fedora
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate core package build, installation, and recipe
        run: scripts/validate-linux-distros.sh "${{ matrix.target }}"

  macos:
    name: C17 runtime on macOS
    needs: policy
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          brew install cmake ninja pkg-config libuv libsodium openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Test C17 runtime
        run: make test-native
