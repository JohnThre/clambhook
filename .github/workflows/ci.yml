name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.0'
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  policy:
    name: Source and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install shell checker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnupg shellcheck
      - name: Validate publication and workflow policy
        run: scripts/check-github-actions.sh
      - name: Lint shell automation
        run: shellcheck scripts/*.sh
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  linux:
    name: GNU/Linux - ${{ matrix.name }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Trisquel 12
            target: trisquel
            runner: ubuntu-24.04
          - name: Rocky Linux 9
            target: rocky
            runner: ubuntu-24.04
          - name: AlmaLinux 9
            target: alma
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trisquel image bootstrap tool
        if: matrix.target == 'trisquel'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq debootstrap
      - name: Validate ClambHook in ${{ matrix.name }}
        run: scripts/validate-linux-distros.sh "${{ matrix.target }}"

  apple:
    name: Native C portability - macOS
    needs: policy
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install native build dependencies
        run: brew install cmake ninja pkg-config libuv libsodium llhttp openssl@3 curl
      - name: Export Homebrew pkg-config paths
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Test native C runtime
        run: make test-native

  android:
    name: Android build, unit tests, and lint
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
      - name: Test, lint, and build Android 12+ app
        working-directory: ui/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:externalNativeBuildDebug
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: ui/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  android-device:
    name: Android ${{ matrix.api }} Compose and JNI
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            task: pixel2Api31DebugAndroidTest
          - api: 33
            task: pixel6Api33DebugAndroidTest
          - api: 36
            task: pixel6Api36DebugAndroidTest
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android ${{ matrix.api }} emulator components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            'system-images;android-${{ matrix.api }};default;x86_64'
      - name: Run Compose and native JNI tests
        working-directory: ui/android
        run: >-
          ./gradlew --no-daemon
          :app:${{ matrix.task }}
          -Pclambhook.managedDeviceTestAbi=x86_64
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload managed-device reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ matrix.api }}-reports
          path: ui/android/app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
          retention-days: 14
