name: Release to GitHub

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the leading v
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      platform:
        description: Platform to publish
        required: true
        default: all
        type: choice
        options: [all, android, linux, macos]

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'push' && 'stable' || inputs.channel }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      platform: ${{ steps.release.outputs.platform }}
      build-number: ${{ steps.release.outputs.build-number }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate publication and workflow policy
        run: scripts/check-github-actions.sh
      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$(git cat-file -t "$GITHUB_REF_NAME")" == "tag" ]]
            verify_home="$RUNNER_TEMP/release-tag-gnupg"
            mkdir -p "$verify_home"
            chmod 0700 "$verify_home"
            GNUPGHOME="$verify_home" gpg --batch --import keys/clambhook-release-key.asc
            fingerprint="$(GNUPGHOME="$verify_home" gpg --batch --with-colons \
              --fingerprint 6FF4807EAD977A9B | awk -F: '$1 == "fpr" { print $10; exit }')"
            [[ "$fingerprint" == "BAFC7769FDA1E0D4EBD23E2F6FF4807EAD977A9B" ]]
            GNUPGHOME="$verify_home" git verify-tag "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            channel="stable"
            platform="all"
          else
            [[ "$GITHUB_REF" == "refs/heads/master" ]]
            version="${REQUESTED_VERSION#v}"
            channel="$REQUESTED_CHANNEL"
            platform="$REQUESTED_PLATFORM"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$channel" == "stable" || "$channel" == "beta" ]]
          [[ "$platform" == "all" || "$platform" == "android" || "$platform" == "linux" || "$platform" == "macos" ]]
          build_number=$((100000 + GITHUB_RUN_NUMBER))
          tag="v${version}"
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "platform=$platform"
            echo "build-number=$build_number"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or normalize release
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "ClambHook ${RELEASE_VERSION}" --generate-notes)
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            args+=(--prerelease --target "$GITHUB_SHA")
          else
            [[ "$(git cat-file -t "$RELEASE_TAG")" == "tag" ]]
            verify_home="$RUNNER_TEMP/release-tag-gnupg"
            mkdir -p "$verify_home"
            chmod 0700 "$verify_home"
            GNUPGHOME="$verify_home" gpg --batch --import keys/clambhook-release-key.asc
            GNUPGHOME="$verify_home" git verify-tag "$RELEASE_TAG"
            args+=(--verify-tag --latest)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            edit_args=(--repo "$GITHUB_REPOSITORY" --title "ClambHook ${RELEASE_VERSION}")
            if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
              edit_args+=(--prerelease --latest=false)
            else
              edit_args+=(--prerelease=false --latest)
            fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" keys/clambhook-release-key.asc \
            --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    name: Sign and publish GNU/Linux ${{ matrix.arch }}
    needs: [prepare, release]
    if: needs.prepare.outputs.platform == 'all' || needs.prepare.outputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install release tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
      - name: Build Ubuntu and Fedora packages with Gluon native image
        env:
          CLAMBHOOK_LINUX_RELEASE_BUILD: "1"
        run: scripts/validate-linux-distros.sh ubuntu fedora
      - name: Import isolated GPG release key
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/prepare-ci-release-gpg.sh "$RUNNER_TEMP" "$GITHUB_ENV"
      - name: Sign package checksums and manifest
        run: scripts/sign-linux-release-artifacts.sh
      - name: Publish GNU/Linux assets to GitHub Release
        run: |
          shopt -s nullglob
          assets=(dist/linux/*.deb dist/linux/*.rpm dist/linux/*.sha256 dist/linux/*.sig dist/linux/clambhook-linux-*-manifest.json)
          (( ${#assets[@]} > 0 ))
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Sign and publish Android 12+
    needs: [prepare, release]
    if: needs.prepare.outputs.platform == 'all' || needs.prepare.outputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.build-number }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Restore Android native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/android/.native-deps
          key: >-
            android-native-${{ runner.os }}-${{ runner.arch }}-ndk-${{
            env.ANDROID_NDK_VERSION }}-${{ hashFiles(
            'scripts/build-android-openssl.sh',
            'scripts/build-android-curl.sh') }}
      - name: Install Android and release tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
      - name: Provision checksum-pinned Gluon GraalVM 17
        run: |
          graal_home="$(bash scripts/provision-graalvm17.sh "$RUNNER_TEMP/graalvm17" gluon)"
          echo "$graal_home/bin" >> "$GITHUB_PATH"
          echo "GRAALVM_HOME=$graal_home" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$graal_home" >> "$GITHUB_ENV"
      - name: Prepare protected Gluon Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/prepare-ci-android-signing.sh "$RUNNER_TEMP" "$GITHUB_ENV"
      - name: Import isolated GPG release key
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/prepare-ci-release-gpg.sh "$RUNNER_TEMP" "$GITHUB_ENV"
      - name: Build, sign, inspect, and package Gluon Android release
        run: make release-android
      - name: Publish Android assets to GitHub Release
        run: |
          shopt -s nullglob
          assets=(dist/android/*.apk dist/android/*.aab dist/android/*.sha256 dist/android/*.sig dist/android/clambhook-android-manifest.json)
          (( ${#assets[@]} > 0 ))
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove temporary Android signing material
        if: always()
        run: rm -f "${CLAMBHOOK_ANDROID_KEYSTORE_PATH:-}"

  macos:
    name: Sign, notarize, and publish macOS
    needs: [prepare, release]
    if: needs.prepare.outputs.platform == 'all' || needs.prepare.outputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 120
    environment: production
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      NOTARYTOOL_PROFILE: clambhook-ci-notary
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install macOS release tools
        run: |
          brew install cmake ninja pkg-config libuv libsodium openssl@3 xcodegen gnupg
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Configure Apple signing, provisioning, and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          [[ -n "$APPLE_TEAM_ID" ]]
          [[ -n "$APPLE_DEVELOPER_ID_P12_BASE64" ]]
          [[ -n "$APPLE_DEVELOPER_ID_P12_PASSWORD" ]]
          [[ -n "$APPLE_KEYCHAIN_PASSWORD" ]]
          [[ -n "$APPLE_ID" ]]
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]
          [[ -n "$APPLE_API_KEY_P8_BASE64" ]]
          [[ -n "$APPLE_API_KEY_ID" ]]
          [[ -n "$APPLE_API_ISSUER_ID" ]]
          [[ -n "$SPARKLE_PRIVATE_KEY_BASE64" ]]
          certificate_path="$RUNNER_TEMP/developer-id-certificate"
          keychain_path="$RUNNER_TEMP/clambhook-release.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          sparkle_key_path="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | openssl base64 -d -A > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$api_key_path"
          printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$sparkle_key_path"
          chmod 0600 "$certificate_path" "$api_key_path" "$sparkle_key_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"
          rm -f "$certificate_path"
          {
            echo "CLAMBHOOK_CI_KEYCHAIN=$keychain_path"
            echo "CLAMBHOOK_DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
            echo "XCODE_AUTHENTICATION_KEY_PATH=$api_key_path"
            echo "XCODE_AUTHENTICATION_KEY_ID=$APPLE_API_KEY_ID"
            echo "XCODE_AUTHENTICATION_KEY_ISSUER_ID=$APPLE_API_ISSUER_ID"
            echo "SPARKLE_PRIVATE_KEY_FILE=$sparkle_key_path"
          } >> "$GITHUB_ENV"
      - name: Resolve pinned Sparkle signing tool
        run: |
          make generate-apple
          xcodebuild -resolvePackageDependencies \
            -project ui/apple/Clambhook.xcodeproj \
            -scheme ClambhookMac \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          sign_update="$(find "$RUNNER_TEMP/SourcePackages" -type f -name sign_update -perm -111 -print -quit)"
          [[ -n "$sign_update" ]]
          echo "SPARKLE_SIGN_UPDATE=$sign_update" >> "$GITHUB_ENV"
      - name: Import isolated GPG release key
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/prepare-ci-release-gpg.sh "$RUNNER_TEMP" "$GITHUB_ENV"
      - name: Build, sign, notarize, and package macOS release
        run: make release-macos
      - name: Publish macOS assets to GitHub Release
        run: |
          shopt -s nullglob
          assets=(
            dist/macos/ClambhookMac-arm64.zip
            dist/macos/ClambhookMac-arm64.dmg
            dist/macos/ClambhookMac-arm64.dmg.sha256
            dist/macos/ClambhookMac-arm64.dmg.sha256.sig
            dist/macos/clambhook*-update-manifest.json
            dist/macos/clambhook*-update-manifest.json.sig
            dist/macos/appcast*.xml
          )
          (( ${#assets[@]} > 0 ))
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove temporary Apple keychain
        if: always()
        run: |
          if [[ -n "${CLAMBHOOK_CI_KEYCHAIN:-}" && -f "$CLAMBHOOK_CI_KEYCHAIN" ]]; then
            security delete-keychain "$CLAMBHOOK_CI_KEYCHAIN"
          fi
          rm -f \
            "${XCODE_AUTHENTICATION_KEY_PATH:-}" \
            "${SPARKLE_PRIVATE_KEY_FILE:-}" \
            "$RUNNER_TEMP/developer-id-certificate"

  beta-channel:
    name: Update rolling beta channel
    needs: [prepare, release, linux, android, macos]
    if: always() && needs.prepare.outputs.channel == 'beta' && needs.release.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Mirror versioned prerelease into rolling beta release
        run: |
          mkdir -p "$RUNNER_TEMP/clambhook-beta-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/clambhook-beta-assets"
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit beta --repo "$GITHUB_REPOSITORY" --title "ClambHook beta" --prerelease --latest=false
          else
            gh release create beta --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ClambHook beta" --notes "Rolling assets for the latest approved ClambHook beta." --prerelease
          fi
          gh release upload beta "$RUNNER_TEMP"/clambhook-beta-assets/* --repo "$GITHUB_REPOSITORY" --clobber
