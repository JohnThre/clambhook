name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL - ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            runner: ubuntu-24.04
            build-mode: none
          - language: go
            runner: ubuntu-24.04
            build-mode: manual
          - language: java-kotlin
            runner: ubuntu-24.04
            build-mode: none
          - language: swift
            runner: macos-15
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install legacy Go native dependencies
        if: matrix.language == 'go'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsodium-dev libssl-dev
      - name: Trace legacy Go sources
        if: matrix.language == 'go'
        run: make build-clib && go build ./...
      - name: Trace Swift package sources without building the macOS app
        if: matrix.language == 'swift'
        run: swift build --package-path ui/apple --target ClambhookShared
      - name: Analyze source
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
