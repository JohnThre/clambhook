name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL - ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            runner: ubuntu-24.04
            build-mode: manual
          - language: java-kotlin
            runner: ubuntu-24.04
            build-mode: none
          - language: swift
            runner: macos-15
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Install C17 build dependencies
        if: matrix.language == 'c-cpp'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake ninja-build pkg-config libuv1-dev libsodium-dev libllhttp-dev
          libssl-dev libcurl4-openssl-dev
      - name: Trace C17 sources
        if: matrix.language == 'c-cpp'
        run: make build-native
      - name: Trace Swift package sources without building the macOS app
        if: matrix.language == 'swift'
        run: swift build --package-path ui/apple --target ClambhookShared
      - name: Analyze source
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
