version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Singapore
    groups:
      actions:
        patterns: ['*']
    ignore:
      # setup-go is deliberately hard-pinned to v6.0.0 (verified by
      # scripts/check-cutover.sh) for the isolated official Outline
      # interoperability peer. Bumps cannot pass the policy gate.
      - dependency-name: actions/setup-go

  - package-ecosystem: gradle
    directory: /ui/android
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Singapore
    groups:
      android:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /ui/javafx
    schedule:
      interval: weekly
      day: monday
      time: '02:45'
      timezone: Asia/Singapore
    groups:
      javafx-gluon:
        patterns: ['*']
    ignore:
      # JavaFX is hard-pinned to 21.0.12 (verified by scripts/check-sbom.py)
      # for GluonFX 1.0.29 native-image compatibility. Newer JavaFX lines
      # (e.g. 26.x) break the Gluon substrate and cannot pass the policy gate.
      - dependency-name: org.openjfx:*

  - package-ecosystem: swift
    directory: /ui/apple
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Singapore
    groups:
      apple:
        patterns: ['*']
