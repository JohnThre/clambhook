version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # setup-go is deliberately hard-pinned to v6.0.0 (verified by
      # scripts/check-cutover.sh) for the isolated official Outline
      # interoperability peer. Bumps cannot pass the policy gate.
      - dependency-name: actions/setup-go

  - package-ecosystem: gradle
    directory: /ui/kotlin
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Singapore
    groups:
      kotlin-ui:
        patterns: ["*"]
    ignore:
      # The Android build is standardized on the stable API 36 SDK.
      # androidx.core 1.19+, okhttp-android 5.5+, and Compose 1.12+ (androidx
      # compose 1.12) require compileSdk 37, which is preview/canary-only.
      - dependency-name: androidx.core:*
        versions: [">= 1.19.0"]
      - dependency-name: com.squareup.okhttp3:*
        versions: [">= 5.5.0"]
      - dependency-name: org.jetbrains.compose*
        versions: [">= 1.12.0"]

  - package-ecosystem: swift
    directory: /ui/apple
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Singapore
    groups:
      apple:
        patterns: ["*"]
