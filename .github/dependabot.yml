version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # setup-go is deliberately hard-pinned to v6.0.0 (verified by
      # scripts/check-cutover.sh) for the isolated official Outline
      # interoperability peer. Bumps cannot pass the policy gate.
      - dependency-name: actions/setup-go
