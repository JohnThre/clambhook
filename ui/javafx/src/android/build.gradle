apply plugin: 'com.android.application'

android {
    namespace 'org.jpfchang.clambhook'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 31
        compileSdk 36
        targetSdkVersion 36
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        implementation 'androidx.activity:activity:1.11.0'
        implementation 'androidx.core:core:1.17.0'
        implementation 'androidx.datastore:datastore-preferences:1.1.1'
        implementation 'androidx.security:security-crypto:1.1.0-alpha06'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
        api fileTree(dir: '../libs', include: '*.aar')
        api fileTree(dir: '../libs', include: '*.jar')
    }

    signingConfigs {
        release {
            if (file('keystore.properties').exists()) {
                Properties settings = new Properties()
                settings.load(new FileInputStream(file('keystore.properties')))
                storeFile = file(settings['storeFile'])
                storePassword = settings['storePassword']
                keyAlias = settings['keyAlias']
                keyPassword = settings['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
