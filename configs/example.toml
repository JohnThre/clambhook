# clambhook configuration template
#
# This public template is intentionally non-operational. Keep real endpoints,
# credentials, keys, profile names, and deployment notes outside public source
# control.

active = "local"

[developer]
enabled = false
mitm_enabled = false
no_cache_enabled = false
capture_limit = 200
body_limit_bytes = 65536
header_value_limit_bytes = 8192
redact_headers = ["authorization", "proxy-authorization", "cookie", "set-cookie", "x-api-key", "api-key", "x-auth-token", "x-csrf-token", "x-xsrf-token", "csrf-token", "xsrf-token"]
redact_query_params = ["token", "access_token", "refresh_token", "id_token", "api_key", "apikey", "key", "secret", "password", "passwd", "code", "session", "auth"]

# Rewrite rules non-interactively modify matching HTTP(S) developer traffic in
# flight — request/response headers and bodies, and (response) status — as an
# automated base layer before breakpoints (interactive) and map rules.
#
# [[developer.rewrite_rule]]
# id = "rw-add-auth"
# name = "Add test auth header"
# enabled = true
# stage = "request"          # request | response | both
# [developer.rewrite_rule.match]
# host = "api.example.com"
# path_prefix = "/v1/"
# [[developer.rewrite_rule.op]]
# target = "header"          # header | body | status
# action = "add"            # header: add|set|remove  body: set|replace  status: set
# field = "X-Test-User"
# value = "dev"
# [[developer.rewrite_rule.op]]
# target = "body"
# action = "replace"         # literal substring replace (value -> replace), no regex
# value = "staging"
# replace = "production"
# [[developer.rewrite_rule.op]]
# target = "status"
# action = "set"
# value = "204"             # only valid when stage is response or both

[prompt]
# Little Snitch-style interactive connection prompts. When enabled, a
# connection that no existing rule already decides is paused and the owning
# local process is surfaced for an allow/block decision (SOCKS5/HTTP listener
# traffic only; darwin and linux). Off by default.
enabled = false
# How long a connection is held awaiting a decision before the default applies.
timeout_seconds = 30
# Outcome when a prompt times out with no answer. false (block) is the safe
# deny-by-default stance for an interactive firewall.
default_allow = false

[traffic]
enabled = true
history_limit = 500
history_max_age = "168h"
# history_path may be set to an absolute local path. Empty uses the OS cache
# directory and stores metadata only: targets, decisions, timings, and bytes.

[[profile]]
name = "local"

  # Optional automatic selection. The first profile in file order with a
  # matching trigger wins; matching is trimmed and case-insensitive. On macOS
  # 14+, SSID matching requires Location Services permission, while an
  # interface-only trigger continues to work.
  # [[profile.network_trigger]]
  # ssid = "Example WiFi"
  # interface = "en0"

  [profile.listen]
  socks5 = "127.0.0.1:1080"
  http = "127.0.0.1:8080"

  [profile.api]
  listen = "127.0.0.1:9090"

  [profile.dns]
  enabled = false
  timeout = "5s"
  # When enabled for TUN mode, TCP/UDP destination port 53 is answered locally
  # and forwarded to encrypted DoH/DoT/DoQ upstreams through the route planner.
  # When disabled, DNS packets route like normal traffic and can match rules.
  #
  # To use your own Control D resolver, set protocol = "controld" and your
  # resolver id; clambhook derives the endpoint, TLS name, and bootstrap IPs.
  #   [[profile.dns.upstream]]
  #   name = "my-controld"
  #   protocol = "controld"
  #   resolver = "replace-with-controld-resolver-id"
  #   transport = "doh"   # doh (default), dot, or doq
  # Free Control D presets (no account) set free = true with a preset resolver:
  #   [[profile.dns.upstream]]
  #   protocol = "controld"
  #   free = true
  #   resolver = "p2"     # ads & tracking; see docs.controld.com/docs/free-dns

  [[profile.chain]]
  name = "default"

    [[profile.chain.server]]
    name = "example"
    address = "example.invalid:443"
    protocol = "replace-with-private-profile"

      [profile.chain.server.settings]
      token = "replace-with-private-value"

  [[profile.chain]]
  name = "backup"

    [[profile.chain.server]]
    name = "backup-example"
    address = "backup.example.invalid:443"
    protocol = "replace-with-private-profile"

      [profile.chain.server.settings]
      token = "replace-with-private-value"

  # Example VMESS server. Both the legacy oracle and native C runtime support
  # its AEAD TCP form (alter_id must be 0 or omitted). security accepts "auto"
  # (default), "aes-128-gcm", or "chacha20-poly1305". Set tls = true to run
  # VMESS over TLS, with optional sni / alpn / skip_cert_verify.
  #   [[profile.chain]]
  #   name = "vmess-example"
  #
  #     [[profile.chain.server]]
  #     name = "vmess-node"
  #     address = "vmess.example.invalid:443"
  #     protocol = "vmess"
  #
  #       [profile.chain.server.settings]
  #       uuid = "00000000-0000-0000-0000-000000000000"
  #       security = "auto"
  #       tls = true
  #       sni = "vmess.example.invalid"

  # Example Trojan server. The native migration runtime currently supports
  # TCP Trojan and wire-compatible clambback hops, including nesting them in
  # one chain. Certificate verification is enabled unless explicitly skipped.
  #   [[profile.chain]]
  #   name = "trojan-example"
  #
  #     [[profile.chain.server]]
  #     name = "trojan-node"
  #     address = "trojan.example.invalid:443"
  #     protocol = "trojan" # or "clambback"
  #
  #       [profile.chain.server.settings]
  #       password = "replace-with-shared-secret"
  #       sni = "trojan.example.invalid"
  #       # alpn = ["h2", "http/1.1"]
  #       # skip_cert_verify = false

  # Example ShadowTLS (v3) chain, supported by both the legacy oracle and native
  # C runtime. ShadowTLS is a transport-obfuscation layer, not an addressed
  # proxy: it performs a genuine TLS 1.3 handshake to a real handshake server
  # (given by sni) and carries an inner protocol on top. Use it as an entry hop
  # in front of a proxy hop (shadowsocks below) that carries the real
  # destination. Only v3 (strict TLS 1.3) is supported.
  #   [[profile.chain]]
  #   name = "shadowtls-example"
  #
  #     [[profile.chain.server]]
  #     name = "stls-entry"
  #     address = "stls.example.invalid:443"
  #     protocol = "shadowtls"
  #
  #       [profile.chain.server.settings]
  #       password = "replace-with-shared-secret"
  #       sni = "www.microsoft.com"   # a real TLS 1.3 handshake server
  #       # alpn = ["h2", "http/1.1"]
  #       # version = 3               # v3 only (default)
  #
  #     [[profile.chain.server]]
  #     name = "ss-exit"
  #     address = "stls.example.invalid:443"
  #     protocol = "shadowsocks"
  #
  #       [profile.chain.server.settings]
  #       method = "aes-128-gcm"
  #       password = "replace-with-shadowsocks-password"
  #       # Other supported AEAD-2018 methods: aes-256-gcm and
  #       # chacha20-ietf-poly1305. Legacy stream ciphers are rejected.

  # Example Tor hop. Run Tor separately and point this server at its SOCKS5
  # port. Optional credentials are circuit-isolation tokens, not account auth.
  # Tor is TCP-only and keeps domain/.onion resolution inside Tor.
  #   [[profile.chain]]
  #   name = "tor-example"
  #
  #     [[profile.chain.server]]
  #     name = "local-tor"
  #     address = "127.0.0.1:9050"
  #     protocol = "tor"
  #
  #       [profile.chain.server.settings]
  #       isolation_user = "clambhook-profile"
  #       isolation_pass = "replace-with-circuit-token"

  [[profile.policy_group]]
  name = "auto"
  type = "url-test"
  chains = ["default", "backup"]
  test_url = "https://www.gstatic.com/generate_204"
  interval = "30s"
  timeout = "5s"
  # Rules can route through smart groups with action = "group:<name>".

  [[profile.policy_group]]
  name = "manual"
  type = "select"
  chains = ["default", "backup"]
  selected = "default"
  # Manual select groups persist their selected chain in this file and can be
  # changed through the API or UI.

  [[profile.rule_set]]
  name = "example-trackers"
  domain_suffixes = ["tracker.example.invalid"]
  cidrs = ["203.0.113.0/24"]
  disabled = false
  # Rule sets are reusable destination matchers. A set may also point at a
  # remote list with url/format; disabled remote sets keep inline entries only.

  [[profile.rule]]
  name = "example-blocklist"
  action = "block"
  domain_suffixes = ["tracker.example.invalid"]
  networks = ["tcp"]

  [[profile.rule]]
  name = "example-direct-lan"
  action = "direct"
  cidrs = ["192.168.0.0/16", "10.0.0.0/8"]

  [[profile.rule]]
  name = "example-block-curl"
  action = "block"
  # Match by owning process: the executable name, its full path, or the path's
  # base name (case-insensitive). Combine with destination matchers to scope a
  # rule to one process reaching one destination.
  processes = ["curl"]

  [[profile.rule]]
  name = "example-auto"
  action = "group:auto"

  [[profile.rule]]
  name = "example-guest-trackers"
  action = "group:manual"
  rule_sets = ["example-trackers"]
  source_cidrs = ["10.10.0.0/16"]

  [[profile.rule_subscription]]
  name = "example-ads"
  url = "https://lists.example.invalid/ads.txt"
  format = "auto"
  action = "block"
  networks = ["tcp", "udp"]
  disabled = true
  # Refreshed subscription caches materialize as generated rules after manual
  # profile rules, so hand-written rules can override broad subscription lists.
